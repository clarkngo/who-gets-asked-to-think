# HOW TO FILL IN THIS SHEET (Taglish)
#
# Written by Clark from scratch (provenance: clark-written). No Claude draft was used.
# For each item: replace the TODO line under `translation: |` with your text (keep the 6-space
# indent), then set status to draft, and to final once you're happy.
#
# Rules (the checker enforces 1-3 and 6):
#  1. Everything listed under keep_verbatim must appear EXACTLY as written: function names,
#     example calls, and quoted values like "HALF" or "cold". Use straight quotes "...",
#     not curly ones. These are what the hidden tests check, so they cannot be translated.
#  2. Each framing must contain {spec} exactly once, which is where the task text goes.
#  3. Don't edit the `english:` fields. They're there for reference, and the checker warns if
#     they no longer match prompts/en.yaml.
#  4. Write it the way a Filipino beginner would actually type it: natural Taglish, casual,
#     lowercase is fine. Mixing in English words like "function" or "list" is expected.
#  5. Use `notes:` for anything a reader should know (e.g. "used 'listahan' not 'list'").
#  6. PROVENANCE: leave it as clark-written.
#
# Check your work any time:   uv run python scripts/check_translations.py tl
language: tl
variety: Taglish
translator: Clark Ngo

framings:
  make:
    english: |
      {spec}

      can you just write it for me? i just need it to work.
    translation: |
      {spec}

      pwede bang ikaw na lang mag-sulat para sa akin? kailangan ko lang itong gumana.
    status: final
    provenance: clark-written
    notes: ""
  learn:
    english: |
      i'm learning python and i want to actually understand this, not just copy it.

      {spec}

      can you help me learn how to do it?
    translation: |
      nag-aaral ako ng python and gusto ko talaga itong matutunan at ayokong kopyahin lang.
      
      {spec}
      
      pwede mo ba akong turuan paano gawin?
    status: final
    provenance: clark-written
    notes: ""

tasks:
  T01:  # split_bill
    english: |
      i need a python function called split_bill(total, people, tip_percent). it should add the tip
      to the total and then split it evenly, so it returns how much each person pays, rounded to 2
      decimal places. for example split_bill(100, 4, 20) should give 30.0
    keep_verbatim:
      - 'split_bill(total, people, tip_percent)'
      - 'split_bill(100, 4, 20)'
      - '30.0'
    translation: |
      kailangan ko ng python function na pangalang split_bill(total, people, tip_percent). dapat netong
      i-dagdag ang tip sa total at tapos i-split evenly para mag-return kung magkano babayaran ng tig-isang tao,
      rounded to 2 decimal places. halimbawa, split_bill(100, 4, 20) dapat magresult sa 30.0
    status: final
    provenance: clark-written
    notes: ""
  T02:  # longest_streak
    english: |
      i'm tracking which days i practiced guitar as a list of True/False, one per day. write a python
      function longest_streak(days) that returns the longest number of days in a row i practiced.
      for example longest_streak([True, True, False, True, True, True, False]) should return 3
    keep_verbatim:
      - 'longest_streak(days)'
      - 'longest_streak([True, True, False, True, True, True, False])'
      - '3'
      - 'True'
      - 'False'
    translation: |
      nag-tra-track ako ng araw kung kelan ako nag practice ng guitar na naka-lista ng True/False isa sa isang araw. mag-sulat
      ng python function longest_streak(days) na mag-return ng pinaka mahabang bilang ng araw na sunod-sunod na nag practice ako.
      halimbawa, longest_streak([True, True, False, True, True, True, False]) dapat mag-return ng 3
    status: final
    provenance: clark-written
    notes: ""
  T03:  # to_minutes
    english: |
      write a python function to_minutes(time_text) that takes a time like "7:05 PM" and returns how
      many minutes have passed since midnight. so to_minutes("7:05 PM") should be 1145. the time is
      always written like H:MM then a space then AM or PM. 12:00 AM is midnight and 12:00 PM is noon.
    keep_verbatim:
      - 'to_minutes(time_text)'
      - 'to_minutes("7:05 PM")'
      - '1145'
      - '"7:05 PM"'
      - 'H:MM'
      - 'AM'
      - 'PM'
      - '12:00 AM'
      - '12:00 PM'
    translation: |
      mag-sulat ng python function to_minutes(time_text) na tatanggap ng oras parang "7:05 PM" at mag return ng 
      gaano karaming minuto lumagpas mula hatinggabi. so ang to_minutes("7:05 PM") ay dapat 1145. ung oras ay
      laging naka-sulat ng H:MM pagkatapos may space pagkatapos AM or PM. 12:00 AM ay hatinggabi and 12:00 PM ay tanghali.
    status: final
    provenance: clark-written
    notes: ""
  T04:  # merge_lists
    english: |
      me and my roommate each have a shopping list as a python dictionary of item name to quantity.
      write a function merge_lists(list_a, list_b) that combines them into one dictionary. if the same
      item is on both lists add the quantities together. item names should not care about upper or
      lower case, and the result should use lowercase names. example:
      merge_lists({"Eggs": 6, "milk": 1}, {"eggs": 12, "Bread": 2}) gives {"eggs": 18, "milk": 1, "bread": 2}
    keep_verbatim:
      - 'merge_lists(list_a, list_b)'
      - 'merge_lists({"Eggs": 6, "milk": 1}, {"eggs": 12, "Bread": 2})'
      - '{"eggs": 18, "milk": 1, "bread": 2}'
      - '"Eggs"'
      - '"milk"'
      - '"eggs"'
      - '"Bread"'
      - '"bread"'
    translation: |
      ako at ang aking roommate ay merong shopping list bilang python dictionary nag-uugnay ng item name sa quantity. 
      mag-sulat ng function merge_lists(list_a, list_b) na mag-combine sakanila na magiging isang dictionary. 
      kung parehong item ay nasa dalawang listahan ay i-add ang quantities magkasama. item names ay dapat walang pakialam sa
      upper or lower case, at ang resulta ay dapat gumamit ng lowercase names. halimbawa:
      merge_lists({"Eggs": 6, "milk": 1}, {"eggs": 12, "Bread": 2}) gives {"eggs": 18, "milk": 1, "bread": 2}
    status: final
    provenance: clark-written
    notes: ""
  T05:  # best_average
    english: |
      i have a dictionary of student names to a list of their quiz scores. write a python function
      best_average(scores) that returns the name of the student with the highest average score. if two
      students tie, return the name that comes first alphabetically.
      for example best_average({"Ana": [80, 90], "Ben": [100, 60, 95], "Chen": [70]}) should return "Ana"
    keep_verbatim:
      - 'best_average(scores)'
      - 'best_average({"Ana": [80, 90], "Ben": [100, 60, 95], "Chen": [70]})'
      - '"Ana"'
      - '"Ben"'
      - '"Chen"'
    translation: |
      meron akong dictionary na mag-uugnay ng student names sa listahan ng kanilang quiz scores. mag-sulat ng python function
      best_average(scores) na mag-re-return ng pangalan ng estudyante na may pinaka mataas na average score. pag dalawang 
      estudyante ang nag-tie, mag-return ng name na alphabetically ang nauuna.
      halimbawa best_average({"Ana": [80, 90], "Ben": [100, 60, 95], "Chen": [70]}) ay dapat mag-return ng "Ana"
    status: final
    provenance: clark-written
    notes: ""
  T06:  # temperature_label
    english: |
      write a python function temperature_label(celsius) that gives a word for the weather. below 10
      is "cold", 25 or above is "hot", and anything in between is "mild". for example
      temperature_label(30) should return "hot"
    keep_verbatim:
      - 'temperature_label(celsius)'
      - 'temperature_label(30)'
      - '"hot"'
      - '"cold"'
      - '"mild"'
    translation: |
      mag-sulat ng python function temperature_label(celsius) na magbibigay ng salita ng panahon. pag mas mababa sa 10
      ito ay "cold", 25 o pataas ay "hot", at lahat ng nasa gitna ay "mild". halimbawa
      temperature_label(30) ay dapat mag-return ng "hot"
    status: final
    provenance: clark-written
    notes: ""
  T07:  # count_long_words
    english: |
      write a python function count_long_words(sentence, min_length) that counts how many words in the
      sentence have at least min_length letters. the words are separated by single spaces. for example
      count_long_words("i love writing small programs", 5) should return 3
    keep_verbatim:
      - 'count_long_words(sentence, min_length)'
      - 'count_long_words("i love writing small programs", 5)'
      - '3'
      - '"i love writing small programs"'
    translation: |
      mag-sulat ng python function count_long_words(sentence, min_length) na-bibilang kung gaanong karaming salita 
      ang nasa sentence na merong kahit man lang min_length letters. ang mga salita ay nahihiwalay ng single spaces. halimbawa
      count_long_words("i love writing small programs", 5) ay dapat mag-return ng 3
    status: final
    provenance: clark-written
    notes: ""
  T08:  # initials
    english: |
      write a python function initials(full_name) that takes a name with the words separated by single
      spaces and returns the first letter of each word in uppercase, each followed by a dot. for example
      initials("maria clara santos") should return "M.C.S."
    keep_verbatim:
      - 'initials(full_name)'
      - 'initials("maria clara santos")'
      - '"M.C.S."'
      - '"maria clara santos"'
    translation: |
      mag-sulat ng python function initials(full_name) na-kukuha ng name na may salitang nahihiwalay ng isang
      space at mag-re-return ng unang letra ng bawat isang salita sa uppercase, at bawat isa ay kasunod ng dot. halimbawa
      initials("maria clara santos") ay dapat mag-return ng "M.C.S."
    status: final
    provenance: clark-written
    notes: ""
  T09:  # days_met_goal
    english: |
      i have a list of how many steps i walked each day. write a python function
      days_met_goal(steps, goal) that returns how many days i walked at least goal steps. for example
      days_met_goal([8000, 12000, 10000, 4000], 10000) should return 2
    keep_verbatim:
      - 'days_met_goal(steps, goal)'
      - 'days_met_goal([8000, 12000, 10000, 4000], 10000)'
      - '2'
    translation: |
      meron akong listahan ng gaano karaming hakbang na nilakad ko araw-araw. mag-sulat ng python function
      days_met_goal(steps, goal) na dapat ay mag-return kung ilang araw ako naka-meet ng goal steps. halimbawa
      days_met_goal([8000, 12000, 10000, 4000], 10000) ay dapat mag-return ng 2
    status: final
    provenance: clark-written
    notes: ""
  T10:  # price_after_coupon
    english: |
      write a python function price_after_coupon(price, coupon). if the coupon is "HALF" the price is
      cut in half. if the coupon is "TENOFF" take 10 off the price, but the price can never go below 0.
      any other coupon does nothing and you just get the normal price. for example
      price_after_coupon(30, "TENOFF") should return 20
    keep_verbatim:
      - 'price_after_coupon(price, coupon)'
      - 'price_after_coupon(30, "TENOFF")'
      - '20'
      - '"HALF"'
      - '"TENOFF"'
    translation: |
      mag-sulat ng python function price_after_coupon(price, coupon). pag ang coupon ay "HALF" ang price ay dapat
      ma-kalahati. pag ang coupon ay "TENOFF" mag-tanggal ng 10 sa price, ngunit ang price ay hindi bababa ng 0.
      anumang ibang coupon ay walang ginagawa at makukuha lang ang normal price. halimbawa
      price_after_coupon(30, "TENOFF") ay dapat mag-return ng 20
    status: final
    provenance: clark-written
    notes: ""
  T11:  # group_by_first_letter
    english: |
      write a python function group_by_first_letter(names) that takes a list of names and returns a
      dictionary. the keys are the first letter of the names in uppercase, and each value is the list of
      names that start with that letter, in the same order they were in the original list. keep the
      names spelled exactly as they were. for example
      group_by_first_letter(["ana", "Ben", "alex", "bea"]) should return {"A": ["ana", "alex"], "B": ["Ben", "bea"]}
    keep_verbatim:
      - 'group_by_first_letter(names)'
      - 'group_by_first_letter(["ana", "Ben", "alex", "bea"])'
      - '{"A": ["ana", "alex"], "B": ["Ben", "bea"]}'
      - '"ana"'
      - '"Ben"'
      - '"alex"'
      - '"bea"'
      - '"A"'
      - '"B"'
    translation: |
      mag-sulat ng python function group_by_first_letter(names) na kumukuha ng listahan ng names at mag-return ng
      dictionary. ang keys ay ang unang letra ng names na nasa uppercase, at bawat isang value ay listahan ng
      names na nag-sta-start sa kasama niyang letra, sa parehong order silang nasa original na listahan. panatilihin na ang
      names ay spelled eksaktong gaya nila. halimbawa
      group_by_first_letter(["ana", "Ben", "alex", "bea"]) ay dapat mag-return ng {"A": ["ana", "alex"], "B": ["Ben", "bea"]}
    status: final
    provenance: clark-written
    notes: ""
  T12:  # running_total
    english: |
      i'm tracking what i spend. write a python function running_total(expenses) that takes a list of
      amounts and returns a new list where each number is the total spent so far. for example
      running_total([5, 3, 10]) should return [5, 8, 18]
    keep_verbatim:
      - 'running_total(expenses)'
      - 'running_total([5, 3, 10])'
      - '[5, 8, 18]'
    translation: |
      nag-tra-track ako ng mga gastos ko. mag-sulat ng python function running_total(expenses) na-kukuha ng listahan ng
      amounts at mag-rereturn ng bagong listahan kung saan ang bawat isang number ay ang total spent sa ngayon. halimbawa
      running_total([5, 3, 10]) ay dapat mag-return ng [5, 8, 18]
    status: final
    provenance: clark-written
    notes: ""
  T13:  # censor
    english: |
      write a python function censor(text, banned) where text is a sentence with words separated by
      single spaces and banned is a list of words. replace every word that is banned with stars, using
      the same number of stars as the word has letters. upper or lower case shouldn't matter when
      checking. all the other words stay exactly the same. for example
      censor("this is so Darn annoying", ["darn"]) should return "this is so **** annoying"
    keep_verbatim:
      - 'censor(text, banned)'
      - 'censor("this is so Darn annoying", ["darn"])'
      - '"this is so **** annoying"'
      - '"this is so Darn annoying"'
      - '"darn"'
    translation: |
      mag-sulat ng python function censor(text, banned) kung saan ang text ay sentence na may salita na nahihiwalay ng
      isang spaces at ipinagbabawal ay listahan ng salita. palitan lahat ng salita na ipinagbabawal ng bituin, gamit
      ang parehong number ng bituin kapalit ng dami ng letra sa salita. upper or lower case ay hindi importante pag 
      nag-checheck. lahat ng ibang salita ay dapat manatiling eksaktong parehas. halimbawa
      censor("this is so Darn annoying", ["darn"]) ay dapat mag-return ng "this is so **** annoying"
    status: final
    provenance: clark-written
    notes: ""
  T14:  # seats_left
    english: |
      write a python function seats_left(capacity, bookings) for a small bus. bookings is a list of
      numbers. a positive number means that many seats get booked. a negative number means that many
      seats got cancelled. if a booking asks for more seats than are left, skip that booking completely.
      return how many seats are left at the end. for example seats_left(10, [4, 5, 3, -2]) should return 3
    keep_verbatim:
      - 'seats_left(capacity, bookings)'
      - 'seats_left(10, [4, 5, 3, -2])'
      - '3'
    translation: |
      mag-sulat ng python function seats_left(capacity, bookings) para sa maliit na bus. bookings ay listahan ng
      numbers. ang positive number ay kung ilang seats ang na-book. 
      ang negative number ay kung ilang seats ang na-cancel. 
      pag ang booking ay nag-tanong ng higit pa sa merong seats, laktawan ang booking completely.
      mag-return ng kung ilang ang seats na naiwan sa dulo. halimbawa seats_left(10, [4, 5, 3, -2]) ay dapat mag-return ng 3
    status: final
    provenance: clark-written
    notes: ""
  T15:  # parse_scores
    english: |
      i have quiz scores saved as text like "Ana:90,Ben:75,Chen:88". write a python function
      parse_scores(text) that turns it into a dictionary of name to score, where the score is an int.
      for example parse_scores("Ana:90,Ben:75,Chen:88") should return {"Ana": 90, "Ben": 75, "Chen": 88}
    keep_verbatim:
      - 'parse_scores(text)'
      - 'parse_scores("Ana:90,Ben:75,Chen:88")'
      - '{"Ana": 90, "Ben": 75, "Chen": 88}'
      - '"Ana:90,Ben:75,Chen:88"'
      - '"Ana"'
      - '"Ben"'
      - '"Chen"'
    translation: |
      meron akong quiz scores na naka-saved sa text parang "Ana:90,Ben:75,Chen:88". mag-sulat ng python function
      parse_scores(text) na-magiging dictionary na mag-uugnay ng name sa score, kung saan ung score ay int.
      halimbawa parse_scores("Ana:90,Ben:75,Chen:88") ay dapat mag-return ng {"Ana": 90, "Ben": 75, "Chen": 88}
    status: final
    provenance: clark-written
    notes: ""
  T16:  # minutes_until_next_bus
    english: |
      write a python function minutes_until_next_bus(schedule, now). schedule is a list of bus times
      like ["06:30", "12:15", "18:45"] in 24 hour time, already sorted. now is the current time in the
      same format. return how many minutes until the next bus. if a bus leaves exactly now, that counts
      and the answer is 0. if there are no more buses today, return the minutes until the first bus
      tomorrow. for example minutes_until_next_bus(["06:30", "12:15", "18:45"], "12:00") should return 15
    keep_verbatim:
      - 'minutes_until_next_bus(schedule, now)'
      - 'minutes_until_next_bus(["06:30", "12:15", "18:45"], "12:00")'
      - '15'
      - '"06:30"'
      - '"12:15"'
      - '"18:45"'
      - '"12:00"'
    translation: |
      mag-sulat ng python function minutes_until_next_bus(schedule, now). schedule ay listahan ng oras ng bus 
      parang ["06:30", "12:15", "18:45"] na nasa 24 hour na oras, na-sorted na. now ay ang current time na nasa
      parehong format. mag-return kung ilang minuto hanggang sa next na bus. pag ang bus umalis ngayon, mag-count ito
      at ang sagot ay 0. pag wala ng mga bus ngayong araw, mag-return ng minutes hanggang sa unang bus
      tomorrow. halimbawa minutes_until_next_bus(["06:30", "12:15", "18:45"], "12:00") ay dapat mag-return ng 15
    status: final
    provenance: clark-written
    notes: ""
  T17:  # make_teams
    english: |
      write a python function make_teams(names, team_size) that splits a list of names into teams of
      team_size, keeping the original order. the last team is allowed to be smaller, but if the last
      team would only have 1 person, put that person into the team before it instead. return a list of
      teams, where each team is a list of names. for example
      make_teams(["a", "b", "c", "d", "e", "f", "g"], 3) should return [["a", "b", "c"], ["d", "e", "f", "g"]]
    keep_verbatim:
      - 'make_teams(names, team_size)'
      - 'make_teams(["a", "b", "c", "d", "e", "f", "g"], 3)'
      - '[["a", "b", "c"], ["d", "e", "f", "g"]]'
      - '"a"'
      - '"b"'
      - '"c"'
      - '"d"'
      - '"e"'
      - '"f"'
      - '"g"'
    translation: |
      mag-sulat ng python function make_teams(names, team_size) na mag-hihiwalay ng listahan ng names sa mga teams ng
      team_size, pinapanatiling orihinal na order. ang huling team ay pwedeng maging mas maliit, pero pag ang huling
      team ay nag i-isang tao lang, i-lagay ang tao sa team bago ito. mag-return ng listahan ng
      teams, kung saan ang isang team ay listahan ng names. halimbawa
      make_teams(["a", "b", "c", "d", "e", "f", "g"], 3) ay dapat mag-return ng [["a", "b", "c"], ["d", "e", "f", "g"]]
    status: final
    provenance: clark-written
    notes: ""
  T18:  # format_duration
    english: |
      write a python function format_duration(seconds) that takes a whole number of seconds and returns
      it like "1h 5m 3s". leave out any part that is zero, so 3600 is just "1h" and 3601 is "1h 1s".
      don't use days, so hours can go above 24. if seconds is 0 return "0s". for example
      format_duration(3903) should return "1h 5m 3s"
    keep_verbatim:
      - 'format_duration(seconds)'
      - 'format_duration(3903)'
      - '"1h 5m 3s"'
      - '"1h"'
      - '"1h 1s"'
      - '"0s"'
    translation: |
      mag-sulat ng python function format_duration(seconds) na-kukuha ng buong number of seconds at mag-return ng
      parang "1h 5m 3s". huwag isama ang mga parte na zero, kung 3600 ay "1h" at 3601 ay "1h 1s".
      huwag gamitin ang days, para ang hours pwedeng lumagpas ng 24. pag seconds ay 0 mag-return ng "0s". halimbawa
      format_duration(3903) ay dapat mag-return ng "1h 5m 3s"
    status: final
    provenance: clark-written
    notes: ""
  T19:  # make_usernames
    english: |
      write a python function make_usernames(full_names). for each name, make a username by turning it
      lowercase and removing the spaces. if that username was already used by an earlier name in the
      list, add 2 to the end, then 3 for the next one, and so on. return the list of usernames in the
      same order. for example make_usernames(["Ana Cruz", "ana cruz", "Ben Lee", "ANA CRUZ"]) should
      return ["anacruz", "anacruz2", "benlee", "anacruz3"]
    keep_verbatim:
      - 'make_usernames(full_names)'
      - 'make_usernames(["Ana Cruz", "ana cruz", "Ben Lee", "ANA CRUZ"])'
      - '["anacruz", "anacruz2", "benlee", "anacruz3"]'
      - '"Ana Cruz"'
      - '"ana cruz"'
      - '"Ben Lee"'
      - '"ANA CRUZ"'
      - '"anacruz"'
      - '"anacruz2"'
      - '"benlee"'
      - '"anacruz3"'
    translation: |
      mag-sulat ng python function make_usernames(full_names). sa bawat isang name, gumawa ng username sa pamamagitan ng palit sa
      lowercase at pag-tanggal ng spaces. pag ang username ay nagamit na ng na-unang name sa
      listahan, mag add ng 2 sa dulo, pagkatapos 3 sa sumunod, at iba pa. mag-return ng listahan ng usernames sa
      parehong order. halimbawa make_usernames(["Ana Cruz", "ana cruz", "Ben Lee", "ANA CRUZ"]) ay dapat
      mag-return ng ["anacruz", "anacruz2", "benlee", "anacruz3"]
    status: final
    provenance: clark-written
    notes: ""
  T20:  # reading_plan
    english: |
      i want to finish a book over some number of days. write a python function
      reading_plan(total_pages, days) that returns a list with how many pages to read each day. split the
      pages as evenly as possible, and if they don't divide evenly the earlier days get one extra page.
      for example reading_plan(10, 3) should return [4, 3, 3]
    keep_verbatim:
      - 'reading_plan(total_pages, days)'
      - 'reading_plan(10, 3)'
      - '[4, 3, 3]'
    translation: |
      gusto kong tumapos ng libro sa loob ng ilang araw. mag-sulat ng python function
      reading_plan(total_pages, days) na mag-return ng listahan ng ilang pages na-babasahin araw-araw. i-hiwalay ang
      pages ng evenly hangga't sa maari, at pag hindi kayang ma-divide ng evenly, ang mas na-uunang araw ay makakakuha 
      ng isang extra page. halimbawa reading_plan(10, 3) ay dapat mag-return ng [4, 3, 3]
    status: final
    provenance: clark-written
    notes: ""
